<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Power Controller – modules</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1080" height="300" rx="12" fill="#f4f5f7"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1f2937">Power Controller – modules</text>
<rect x="20" y="60" width="180" height="110" rx="8" fill="#e6ebf2" stroke="#9ca3af" stroke-width="1.2"/><text x="110.0" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Inputs</text><text x="110.0" y="102" text-anchor="middle" font-size="11.5" fill="#6b7280">Nord Pool spot</text><text x="110.0" y="118" text-anchor="middle" font-size="11.5" fill="#6b7280">Grid meter, phase currents</text><text x="110.0" y="134" text-anchor="middle" font-size="11.5" fill="#6b7280">Weather, room temps</text><text x="110.0" y="150" text-anchor="middle" font-size="11.5" fill="#6b7280">Occupancy selector, Mode</text><rect x="240" y="60" width="180" height="110" rx="8" fill="#e9efe9" stroke="#9ca3af" stroke-width="1.2"/><text x="330.0" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">1 · Price</text><text x="330.0" y="102" text-anchor="middle" font-size="11.5" fill="#6b7280">Price model (Norgespris/spot)</text><text x="330.0" y="118" text-anchor="middle" font-size="11.5" fill="#6b7280">Grid tariff + capacity steps</text><text x="330.0" y="134" text-anchor="middle" font-size="11.5" fill="#6b7280">72 h all-in price</text><text x="330.0" y="150" text-anchor="middle" font-size="11.5" fill="#6b7280">hourly · on new prices</text><rect x="460" y="60" width="180" height="110" rx="8" fill="#e9efe9" stroke="#9ca3af" stroke-width="1.2"/><text x="550.0" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">2 · Plan</text><text x="550.0" y="102" text-anchor="middle" font-size="11.5" fill="#6b7280">72 h LP optimisation</text><text x="550.0" y="118" text-anchor="middle" font-size="11.5" fill="#6b7280">thermal zones, EV, hot water</text><text x="550.0" y="134" text-anchor="middle" font-size="11.5" fill="#6b7280">occupancy &amp; schedules</text><text x="550.0" y="150" text-anchor="middle" font-size="11.5" fill="#6b7280">hourly at :59 · on changes</text><rect x="680" y="60" width="180" height="110" rx="8" fill="#ece9f2" stroke="#9ca3af" stroke-width="1.2"/><text x="770.0" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">3 · Distribution</text><text x="770.0" y="102" text-anchor="middle" font-size="11.5" fill="#6b7280">grid / tariff / overload limits</text><text x="770.0" y="118" text-anchor="middle" font-size="11.5" fill="#6b7280">priority + lending</text><text x="770.0" y="134" text-anchor="middle" font-size="11.5" fill="#6b7280">actuation of devices</text><text x="770.0" y="150" text-anchor="middle" font-size="11.5" fill="#6b7280">every 10 s</text><rect x="900" y="60" width="160" height="110" rx="8" fill="#f2ece4" stroke="#9ca3af" stroke-width="1.2"/><text x="980.0" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Devices</text><text x="980.0" y="102" text-anchor="middle" font-size="11.5" fill="#6b7280">heat pumps, heaters</text><text x="980.0" y="118" text-anchor="middle" font-size="11.5" fill="#6b7280">water heater</text><text x="980.0" y="134" text-anchor="middle" font-size="11.5" fill="#6b7280">EV charger (OCPP)</text><text x="980.0" y="150" text-anchor="middle" font-size="11.5" fill="#6b7280">switches</text><line x1="200" y1="115" x2="240" y2="115" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><line x1="420" y1="115" x2="460" y2="115" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><text x="440.0" y="109.0" text-anchor="middle" font-size="10.5" fill="#6b7280">prices</text><line x1="640" y1="115" x2="680" y2="115" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><text x="660.0" y="109.0" text-anchor="middle" font-size="10.5" fill="#6b7280">plan kWh/h</text><line x1="860" y1="115" x2="900" y2="115" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><text x="880.0" y="109.0" text-anchor="middle" font-size="10.5" fill="#6b7280">commands</text><rect x="460" y="210" width="400" height="70" rx="8" fill="#f0f0f0" stroke="#9ca3af" stroke-width="1.2"/><text x="660.0" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">4 · Learning &amp; bookkeeping</text><text x="660.0" y="252" text-anchor="middle" font-size="11.5" fill="#6b7280">thermal model (RLS), legionella, plan vs. actual, shadow (Norgespris vs. spot)</text><line x1="950" y1="170" x2="860" y2="245" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5,4"/><text x="905.0" y="201.5" text-anchor="middle" font-size="10.5" fill="#6b7280">measured</text><line x1="560" y1="210" x2="560" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5,4"/>
</svg>
