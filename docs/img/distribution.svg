<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>3 · Distribution module (every 10 s)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="440" rx="12" fill="#f4f5f7"/>
<text x="20" y="30" font-size="16" font-weight="700" fill="#1f2937">3 · Distribution module (every 10 s)</text>
<rect x="20" y="80" width="150" height="90" rx="8" fill="#e6ebf2" stroke="#9ca3af" stroke-width="1.2"/><text x="95.0" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Grid</text><text x="95.0" y="122" text-anchor="middle" font-size="11.5" fill="#6b7280">main fuse</text><text x="95.0" y="138" text-anchor="middle" font-size="11.5" fill="#6b7280">phase currents</text><rect x="200" y="80" width="160" height="90" rx="8" fill="#ece9f2" stroke="#9ca3af" stroke-width="1.2"/><text x="280.0" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Grid limiter</text><text x="280.0" y="122" text-anchor="middle" font-size="11.5" fill="#6b7280">min(internal, external)</text><text x="280.0" y="138" text-anchor="middle" font-size="11.5" fill="#6b7280">per phase [A]</text><rect x="390" y="80" width="160" height="90" rx="8" fill="#ece9f2" stroke="#9ca3af" stroke-width="1.2"/><text x="470.0" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Tariff limiter</text><text x="470.0" y="122" text-anchor="middle" font-size="11.5" fill="#6b7280">kWh left this hour</text><text x="470.0" y="138" text-anchor="middle" font-size="11.5" fill="#6b7280">→ limit now [kW]</text><rect x="580" y="80" width="170" height="90" rx="8" fill="#ece9f2" stroke="#9ca3af" stroke-width="1.2"/><text x="665.0" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Overload acceptance</text><text x="665.0" y="122" text-anchor="middle" font-size="11.5" fill="#6b7280">5 %: 10 min · 20 %: 2 min</text><text x="665.0" y="138" text-anchor="middle" font-size="11.5" fill="#6b7280">then ramp to rated</text><rect x="780" y="80" width="200" height="90" rx="8" fill="#e9efe9" stroke="#9ca3af" stroke-width="1.2"/><text x="880.0" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Distribution</text><text x="880.0" y="122" text-anchor="middle" font-size="11.5" fill="#6b7280">minus baseload + uncommitted</text><text x="880.0" y="138" text-anchor="middle" font-size="11.5" fill="#6b7280">by priority &amp; plan</text><line x1="170" y1="125" x2="200" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><line x1="360" y1="125" x2="390" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><line x1="550" y1="125" x2="580" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><line x1="750" y1="125" x2="780" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><rect x="640" y="230" width="160" height="80" rx="8" fill="#f2ece4" stroke="#9ca3af" stroke-width="1.2"/><text x="720.0" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Device A</text><text x="720.0" y="272" text-anchor="middle" font-size="11.5" fill="#6b7280">planned · idle</text><rect x="830" y="230" width="160" height="80" rx="8" fill="#f2ece4" stroke="#9ca3af" stroke-width="1.2"/><text x="910.0" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Device B</text><text x="910.0" y="272" text-anchor="middle" font-size="11.5" fill="#6b7280">planned · running</text><rect x="830" y="340" width="160" height="80" rx="8" fill="#f2ece4" stroke="#9ca3af" stroke-width="1.2"/><text x="910.0" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Device C</text><text x="910.0" y="382" text-anchor="middle" font-size="11.5" fill="#6b7280">blocked → borrows</text><line x1="880" y1="170" x2="710" y2="230" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><line x1="880" y1="170" x2="910" y2="230" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/><line x1="720" y1="310" x2="830" y2="370" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5,4"/><text x="775.0" y="334.0" text-anchor="middle" font-size="10.5" fill="#6b7280">lends idle reservation</text><rect x="20" y="230" width="520" height="110" rx="8" fill="#f0f0f0" stroke="#9ca3af" stroke-width="1.2"/><text x="280.0" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Rules</text><text x="280.0" y="272" text-anchor="middle" font-size="11.5" fill="#6b7280">only planned (or Priority now) devices get power</text><text x="280.0" y="288" text-anchor="middle" font-size="11.5" fill="#6b7280">an idle reservation is lent to planned-but-blocked devices</text><text x="280.0" y="304" text-anchor="middle" font-size="11.5" fill="#6b7280">the lender takes it back immediately when it needs it</text><text x="280.0" y="320" text-anchor="middle" font-size="11.5" fill="#6b7280">shedding when the hour or a phase would be exceeded</text>
</svg>
